name: ci-pr

on:
  pull_request:
    branches: ["master"]

# Not applied to ci-main: a push to master must never cancel the run validating
# the commit before it.
concurrency:
  group: ci-pr-${{ github.head_ref }}
  cancel-in-progress: true

# The Python whose results feed coverage, the report and Sonar. Every supported
# version is tested; see the matrix of `tests-fast`.
env:
  PRIMARY_PYTHON: "3.12"

permissions:
  contents: read
  pull-requests: write
  security-events: write
  id-token: write

jobs:
  # The two lanes together are the whole of `-m "not integration"`, run on every
  # supported Python; the list lives only here. Only the PRIMARY_PYTHON leg
  # measures coverage, and the 3.14 leg adds the model coverage, so `validate`
  # combines the same four data files as before the matrix.
  tests-fast:
    name: tests-fast (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Wheels only, so no sdist setup script runs while installing uv.
      - name: Install uv
        run: |
          pip install --only-binary :all: "uv==0.10.2"

      - name: Configure uv environment path
        shell: bash
        run: |
          set -euo pipefail
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/uv-ci-fast" >> "$GITHUB_ENV"

      # The glob is '*/agent.yaml' because each corpus entry is a directory;
      # '*.yaml' matches nothing and the validator still exits 0.
      - name: Validate agent artifact corpus
        shell: bash
        env:
          PYTHONPATH: tests/unit/ai/fixtures/fake_pkgs
        run: |
          set -euo pipefail
          uv run --frozen python -m loom.ai.validate 'tests/unit/ai/fixtures/corpus_v1/*/agent.yaml'

      # Deselected rather than skipped: a skipped test reads as approved.
      # COVERAGE_FILE names the data file so `coverage combine` finds every lane.
      - name: Run the fast lane
        shell: bash
        env:
          COVERAGE_FILE: .coverage.fast
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -euo pipefail
          coverage_args=()
          if [ "${PYTHON_VERSION}" = "${PRIMARY_PYTHON}" ]; then
            coverage_args=(--cov --cov-report=)
          fi
          uv run --frozen --group mcp-tests --with "pytest-cov==7.1.0" --with "pytest-xdist==3.6.1" \
            pytest -m "not integration and not slow" \
            --ignore=tests/unit/etl/backends/test_spark \
            -n 4 "${coverage_args[@]}" \
            --junitxml=junit-fast.xml -o junit_family=legacy

      # A wall-clock budget measured under four workers measures the contention.
      - name: Run the slow lane serially
        shell: bash
        env:
          COVERAGE_FILE: .coverage.slow
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -euo pipefail
          coverage_args=()
          if [ "${PYTHON_VERSION}" = "${PRIMARY_PYTHON}" ]; then
            coverage_args=(--cov --cov-report=)
          fi
          uv run --frozen --group mcp-tests --with "pytest-cov==7.1.0" \
            pytest -m "slow and not integration" \
            --ignore=tests/unit/etl/backends/test_spark \
            "${coverage_args[@]}" \
            --junitxml=junit-slow.xml -o junit_family=legacy

      # The model layer has a branch only Python 3.14 takes (annotationlib), so
      # its coverage comes from here, in an environment with nothing but the
      # 'testing' extra: the model must not lean on a development dependency.
      - name: Run the model tests with coverage
        if: ${{ matrix.python == '3.14' }}
        shell: bash
        env:
          COVERAGE_FILE: .coverage.model
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/uv-ci-model" \
            uv run --frozen --no-default-groups --extra testing \
            --with "pytest-cov==7.1.0" pytest tests/unit/core/model --cov --cov-report=

      - name: Store fast lane results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-fast-${{ matrix.python }}
          path: |
            junit-fast.xml
            junit-slow.xml
            .coverage.fast
            .coverage.slow
            .coverage.model
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Serial: each xdist worker starts its own JVM, which under coverage cancels
  # the parallelism out.
  tests-spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Wheels only, so no sdist setup script runs while installing uv.
      - name: Install uv
        run: |
          pip install --only-binary :all: "uv==0.10.2"

      - name: Configure uv environment path
        shell: bash
        run: |
          set -euo pipefail
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/uv-ci-spark" >> "$GITHUB_ENV"

      - name: Run the Spark lane with coverage
        shell: bash
        env:
          COVERAGE_FILE: .coverage.spark
        run: |
          set -euo pipefail
          uv run --frozen --with "pytest-cov==7.1.0" \
            pytest tests/unit/etl/backends/test_spark \
            --cov --cov-report= \
            --junitxml=junit-spark.xml -o junit_family=legacy

      - name: Store Spark lane results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-spark
          path: |
            junit-spark.xml
            .coverage.spark
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The gate: cheap checks plus the merged results, so a failure in either lane
  # still blocks here.
  validate:
    needs: [tests-fast, tests-spark, integration]
    if: ${{ !cancelled() && needs.tests-fast.result == 'success' && needs.tests-spark.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.integration.result) }}
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Wheels only, so no sdist setup script runs while installing uv.
      - name: Install uv
        run: |
          pip install --only-binary :all: "uv==0.10.2"

      - name: Configure uv environment path
        shell: bash
        run: |
          set -euo pipefail
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/uv-ci-pr" >> "$GITHUB_ENV"

      - name: Fetch PR base branch for changelog diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Released guard revisions are immutable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          bash scripts/ci/check_released_guard.sh tags

      # The report is the primary version's; the other legs gate through `needs`.
      - name: Download fast lane results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results-fast-${{ env.PRIMARY_PYTHON }}

      - name: Download Spark lane results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results-spark

      - name: Download model coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results-fast-3.14
          path: model-coverage

      - name: Keep only the model coverage of the 3.14 leg
        shell: bash
        run: |
          set -euo pipefail
          mv model-coverage/.coverage.model .coverage.model
          rm -rf model-coverage

      - name: Download integration coverage
        if: ${{ needs.integration.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-integration

      - name: Combine the results of every lane
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/merge_test_results.py \
            --junit junit-fast.xml --junit junit-slow.xml --junit junit-spark.xml \
            --junit-output junit.xml
          coverage_files=(.coverage.fast .coverage.slow .coverage.spark .coverage.model)
          if [ -f .coverage.integration ]; then
            coverage_files+=(.coverage.integration)
          fi
          uv run --frozen --with "pytest-cov==7.1.0" coverage combine "${coverage_files[@]}"
          uv run --frozen --with "pytest-cov==7.1.0" coverage json -o coverage.json
          uv run --frozen --with "pytest-cov==7.1.0" coverage xml -o coverage.xml

      # test-results-dir points at the merged files, so the suite is not re-run.
      - name: Quality report (strict gate)
        id: quality
        continue-on-error: true
        uses: MassiveDataScope/loom-actions/actions/python/quality-report@1260b7861a6e5013daf36396fb4782c41e5a1c28 # v1.10.0
        with:
          src-dir: src
          test-dir: tests
          coverage-threshold: "90"
          fail-on-quality: "any"
          fail-on-security: "high"
          include-security: "true"
          test-results-dir: "."

      - name: Publish PR quality comment
        if: ${{ always() && steps.quality.outputs.report-file != '' }}
        uses: MassiveDataScope/loom-actions/actions/core/pr-comment-update@1260b7861a6e5013daf36396fb4782c41e5a1c28 # v1.10.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tags: "<!-- loom-quality-report -->"
          body-file: ${{ steps.quality.outputs.report-file }}

      - name: Compute candidate prerelease version
        id: version
        uses: MassiveDataScope/loom-actions/actions/release/versioning-branch-semantic@1260b7861a6e5013daf36396fb4782c41e5a1c28 # v1.10.0
        with:
          branch: ${{ github.head_ref }}
          prerelease: "true"

      # The version itself comes from the tag, so what this lane reads from the
      # calculator is `deploy`: whether this branch class ships a prerelease.
      - name: Restore the files the calculator rewrote
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "${path}" in
              pyproject.toml|uv.lock|CHANGELOG.md) ;;
              *)
                echo "Release actions modified unexpected tracked file: ${path}"
                exit 1
                ;;
            esac
          done < <(git diff --name-only HEAD)
          git restore --source=HEAD --staged --worktree -- pyproject.toml uv.lock CHANGELOG.md

      # hatch-vcs derives this from the tag and the distance from it, which is
      # the version the prerelease will actually carry. The calculator cannot
      # answer it any more: it reads project.version, which no longer exists.
      - name: Resolve the prerelease version
        id: prerelease
        shell: bash
        run: |
          set -euo pipefail
          version=$(uv run --frozen python -c \
            "import importlib.metadata as m; print(m.version('loom-kernel'))")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog preview
        id: changelog
        continue-on-error: true
        uses: MassiveDataScope/loom-actions/actions/release/changelog-conventional-commit@1260b7861a6e5013daf36396fb4782c41e5a1c28 # v1.10.0
        with:
          mode: "pr"
          branch: ${{ github.event.pull_request.head.sha }}
          version: ${{ steps.version.outputs.deploy == 'true' && steps.prerelease.outputs.version || 'UNRELEASED' }}
          pr-number: ${{ github.event.pull_request.number }}
          base-ref: origin/${{ github.base_ref }}
          output: changelog_preview.md

      - name: Publish PR changelog comment
        if: ${{ steps.changelog.outcome == 'success' && steps.changelog.outputs.output_path != '' }}
        uses: MassiveDataScope/loom-actions/actions/core/pr-comment-update@1260b7861a6e5013daf36396fb4782c41e5a1c28 # v1.10.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tags: "<!-- changelog-preview -->,<!-- branch-source:${{ github.head_ref }} -->"
          body-file: ${{ steps.changelog.outputs.output_path }}

      # --no-build is unusable: antlr4-python3-runtime, required by omegaconf,
      # ships no wheel. The glob is '*/agent.yaml' because each corpus entry is a
      # the validator exits 0 on an empty match — so the wrong glob is a step
      # that passes without validating anything.
      - name: Upload coverage to Codecov
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Dependabot pull requests get no repository secrets, so they run without the scan.
      - name: Require SonarQube analysis configuration
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          [ -n "${SONAR_TOKEN}" ] || missing="${missing} SONAR_TOKEN(secret)"
          [ -n "${SONAR_HOST_URL}" ] || missing="${missing} SONAR_HOST_URL(secret)"
          [ -n "${SONAR_PROJECT_KEY}" ] || missing="${missing} SONAR_PROJECT_KEY(variable)"
          if [ -n "${missing}" ]; then
            echo "SonarQube scan cannot run, missing:${missing}"
            echo "Without it the scan is skipped and the only analysis left is"
            echo "SonarCloud Automatic Analysis, which ignores sonar-project.properties:"
            echo "exclusions and issue suppressions silently stop applying."
            exit 1
          fi

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Setup Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # master

      - name: Snyk dependency scan by scope (core/dev/extras)
        id: snyk
        if: ${{ env.SNYK_TOKEN != '' }}
        continue-on-error: true
        shell: bash
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        run: |
          set -euo pipefail

          MANIFEST_DIR="$RUNNER_TEMP/snyk-manifests"
          mkdir -p "$MANIFEST_DIR"

          # Two exports of the same locked resolution: Snyk reads the plain
          # manifest, pip installs the hashed twin so every downloaded artifact
          # is verified against uv.lock.
          uv export --frozen --no-default-groups --no-dev --no-hashes --no-emit-project \
            -o "$MANIFEST_DIR/requirements-core.txt"
          uv export --frozen --no-default-groups --no-dev --no-emit-project \
            -o "$MANIFEST_DIR/hashed-core.txt"
          uv export --frozen --only-group dev --no-hashes --no-emit-project \
            -o "$MANIFEST_DIR/requirements-dev.txt"
          uv export --frozen --only-group dev --no-emit-project \
            -o "$MANIFEST_DIR/hashed-dev.txt"

          for extra in rest sqlalchemy config cache pyspark prometheus celery streaming; do
            uv export --frozen --no-default-groups --no-dev --extra "$extra" \
              --no-hashes --no-emit-project \
              -o "$MANIFEST_DIR/requirements-extra-${extra}.txt"
            uv export --frozen --no-default-groups --no-dev --extra "$extra" \
              --no-emit-project \
              -o "$MANIFEST_DIR/hashed-extra-${extra}.txt"
          done

          python -m pip install --require-hashes -r "$MANIFEST_DIR/hashed-core.txt"
          snyk test --severity-threshold=high \
            --skip-unresolved \
            --file="$MANIFEST_DIR/requirements-core.txt" \
            --package-manager=pip \
            --project-name="loom-py/core"

          python -m pip install --require-hashes -r "$MANIFEST_DIR/hashed-dev.txt"
          snyk test --severity-threshold=high \
            --skip-unresolved \
            --file="$MANIFEST_DIR/requirements-dev.txt" \
            --package-manager=pip \
            --project-name="loom-py/dev"

          for extra in rest sqlalchemy config cache pyspark prometheus celery streaming; do
            python -m pip install --require-hashes -r "$MANIFEST_DIR/hashed-extra-${extra}.txt"
            snyk test --severity-threshold=high \
              --skip-unresolved \
              --file="$MANIFEST_DIR/requirements-extra-${extra}.txt" \
              --package-manager=pip \
              --project-name="loom-py/extra-${extra}"
          done

      - name: Report the Snyk outcome
        if: ${{ always() && env.SNYK_TOKEN != '' }}
        env:
          OUTCOME: ${{ steps.snyk.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Snyk dependency scan: \`${OUTCOME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${OUTCOME}" != "success" ]; then
            {
              echo
              echo "The scan did not complete, so **no dependency was cleared and none was"
              echo "reported vulnerable**. This does NOT block the build: a scanner that is"
              echo "unreachable, rate-limited or refusing an expired \`SNYK_TOKEN\` says"
              echo "nothing about this code. Read the step log: an \`Authentication error"
              echo "(SNYK-0005)\` with \`401 Unauthorized\` means the token needs renewing"
              echo "in Snyk and updating in the repository secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Snyk scan did not complete::No dependency was scanned. This does NOT block the build. A 401 with SNYK-0005 means the SNYK_TOKEN is expired or unprovisioned; renew it in Snyk and update the repository secret."
          fi

      # --no-build is unusable: antlr4-python3-runtime, required by omegaconf,
      # ships no wheel.
      - name: Build the prerelease distributions
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && steps.version.outputs.deploy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --with "build==1.3.0" python -m build

      # Trusted publishing: TestPyPI mints a token for this repository and this
      # workflow, for this run. A fork gets no OIDC identity, so it cannot publish.
      - name: Publish prerelease package to TestPyPI
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && steps.version.outputs.deploy == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 2026-07-28 (handles Metadata-Version 2.5)
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Enforce changelog generation
        if: ${{ always() && !startsWith(github.head_ref, 'docs/release-') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.changelog.outcome }}" != "success" ]; then
            echo "Changelog preview generation failed"
            exit 1
          fi

      - name: Enforce quality gate
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.quality.outcome }}" != "success" ] || [ "${{ steps.quality.outputs.blocking }}" = "true" ]; then
            echo "Blocking quality/security conditions detected"
            exit 1
          fi

  # Runs the agent suites against the LATEST published pydantic-ai rather than
  # the locked one, so an upstream break arrives as an annotation the day it
  # ships. Non-blocking, but never a silent grey tick either.
  pydantic-ai-canary:
    if: ${{ !startsWith(github.head_ref, 'docs/release-') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          pip install --only-binary :all: "uv==0.10.2"

      - name: Configure uv environment path
        shell: bash
        run: |
          set -euo pipefail
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/uv-ci-canary" >> "$GITHUB_ENV"

      # Locked sync first, so only the pydantic-ai family moves.
      - name: Sync the locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen

      # Resolved first, then installed as an exact pin from wheels: the
      # supply-chain contract refuses a floating version or an sdist.
      - name: Resolve the latest published versions
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          for package in pydantic-ai-slim pydantic-ai-harness fasta2a a2a-sdk; do
            version="$(python -c 'import json,sys,urllib.request; print(json.load(urllib.request.urlopen("https://pypi.org/pypi/" + sys.argv[1] + "/json", timeout=30))["info"]["version"])' "$package")"
            echo "Latest ${package}: ${version}"
            echo "${package//-/_}=${version}" >> "$GITHUB_ENV"
          done

      - name: Install the latest release, pinned and wheels-only
        id: upgrade
        shell: bash
        run: |
          set -euo pipefail
          # --python is required: uv pip honours VIRTUAL_ENV, not
          # UV_PROJECT_ENVIRONMENT, so without it the install cannot find the
          # environment 'uv sync' just created and fails asking for a venv.
          uv pip install --python "$UV_PROJECT_ENVIRONMENT" --only-binary :all: \
            "pydantic-ai-slim[anthropic,bedrock,openai]==${pydantic_ai_slim}" \
            "pydantic-ai-harness[skills]==${pydantic_ai_harness}" \
            "fasta2a==${fasta2a}" \
            "a2a-sdk==${a2a_sdk}"
          {
            echo "resolved<<EOF"
            echo "pydantic-ai-slim==${pydantic_ai_slim}"
            echo "pydantic-ai-harness==${pydantic_ai_harness}"
            echo "fasta2a==${fasta2a}"
            echo "a2a-sdk==${a2a_sdk}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run the agent suites against the latest release
        id: canary
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest tests/unit/ai tests/contract/ai tests/integration/ai -q

      # Always reports, pass or fail: the version tested is as useful as the
      # verdict, because it is what pins the upgrade when the verdict is red.
      - name: Report the canary verdict
        if: ${{ always() }}
        shell: bash
        env:
          RESOLVED: ${{ steps.upgrade.outputs.resolved }}
          OUTCOME: ${{ steps.canary.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## pydantic-ai churn canary: \`${OUTCOME}\`"
            echo
            echo "Versions under test:"
            echo '```'
            echo "${RESOLVED}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${OUTCOME}" != "success" ]; then
            echo "::warning title=pydantic-ai churn canary failed::The agent suites fail against the latest pydantic-ai. This does NOT block the PR. It means the next upgrade of the pinned version needs work first — read the job log, then either adapt the adapter or hold the pin."
          fi

  # Runs the agent suites against the LOWEST pydantic-ai the extras declare, so
  # the floor in pyproject.toml is a tested claim: the lock covers the pinned
  # version, the canary the latest, and this job the bottom of the range.
  # Blocking: a floor that does not pass must be raised, not advertised.
  pydantic-ai-floor:
    if: ${{ !startsWith(github.head_ref, 'docs/release-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          pip install --only-binary :all: "uv==0.10.2"

      - name: Configure uv environment path
        shell: bash
        run: |
          set -euo pipefail
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/uv-ci-floor" >> "$GITHUB_ENV"

      - name: Sync the locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen

      # Read from the `ai-pydantic` extra, so raising the floor there is the
      # only edit a new floor needs.
      - name: Resolve the declared floor
        shell: bash
        run: |
          set -euo pipefail
          floor="$(uv run --no-sync python - <<'PY'
          import tomllib
          from packaging.requirements import Requirement

          with open("pyproject.toml", "rb") as handle:
              extras = tomllib.load(handle)["project"]["optional-dependencies"]
          specifier = Requirement(extras["ai-pydantic"][0]).specifier
          print(next(spec.version for spec in specifier if spec.operator == ">="))
          PY
          )"
          echo "Declared floor: pydantic-ai-slim==${floor}"
          echo "pydantic_ai_floor=${floor}" >> "$GITHUB_ENV"

      - name: Install the floor release, pinned and wheels-only
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --python "$UV_PROJECT_ENVIRONMENT" --only-binary :all: \
            "pydantic-ai-slim[anthropic,bedrock,openai,spec,typesafe]==${pydantic_ai_floor}"

      - name: Run the agent suites against the floor release
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest tests/unit/ai tests/contract/ai tests/integration/ai -q

  # ---------------------------------------------------------------------------
  # Integration lane: everything marked `integration` needs a real external
  # service, so it runs here with the services actually provisioned — never as a
  # silent skip inside the fast lane. The same docker-compose.local.yaml that
  # developers use locally is the single source of truth for how these services
  # are configured.
  #
  # The Kafka suite runs twice: Redpanda is the fast loop, Apache Kafka in KRaft
  # mode is the fidelity check. The partitioned source uses the consumer group
  # purely as an offset store (assign, never subscribe), and that is exactly the
  # area where broker implementations legitimately diverge — a green Redpanda run
  # is not evidence that Apache Kafka agrees.
  # ---------------------------------------------------------------------------
  integration:
    if: ${{ !startsWith(github.head_ref, 'docs/release-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          pip install --only-binary :all: "uv==0.10.2"

      - name: Configure uv environment path
        shell: bash
        run: |
          set -euo pipefail
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/uv-ci-integration" >> "$GITHUB_ENV"

      - name: Start integration services
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.local.yaml up -d redpanda kafka clickhouse mongo postgres

      - name: Wait for services to report healthy
        shell: bash
        run: |
          set -euo pipefail
          for service in redpanda kafka clickhouse mongo postgres; do
            container="$(docker compose -f docker-compose.local.yaml ps -q "$service")"
            for _ in $(seq 1 60); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$container")"
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            if [ "$(docker inspect -f '{{.State.Health.Status}}' "$container")" != "healthy" ]; then
              echo "::error::$service never became healthy"
              docker compose -f docker-compose.local.yaml logs "$service"
              exit 1
            fi
          done

      - name: Integration tests (Redpanda)
        shell: bash
        env:
          LOOM_KAFKA_IT_BOOTSTRAP: localhost:19092
          LOOM_MONGO_IT_URI: mongodb://localhost:27017/?replicaSet=rs0
          LOOM_PG_IT_URI: postgresql+asyncpg://postgres:loom@localhost:55432/postgres
          COVERAGE_FILE: .coverage.integration
        run: |
          set -euo pipefail
          uv run --frozen pytest -m integration -ra \
            --cov=src/loom --cov-report=xml:coverage-integration.xml

      - name: Integration tests (Apache Kafka fidelity check)
        shell: bash
        env:
          LOOM_KAFKA_IT_BOOTSTRAP: localhost:19093
        run: |
          set -euo pipefail
          uv run --frozen pytest tests/integration/streaming/kafka -ra

      - name: Store integration coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload integration coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          files: coverage-integration.xml
          flags: postgres
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Dump service logs on failure
        if: ${{ failure() }}
        shell: bash
        run: docker compose -f docker-compose.local.yaml logs --no-color --tail=200

      - name: Stop integration services
        if: ${{ always() }}
        shell: bash
        run: docker compose -f docker-compose.local.yaml down -v
