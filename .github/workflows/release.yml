name: release

# Merging a pull request labelled `release` publishes everything merged since
# the last tag. The dispatch resumes a run that stopped halfway.
on:
  pull_request:
    types: [closed]
    branches: ["master"]
  workflow_dispatch:
    inputs:
      merge_sha:
        description: "Commit on master to release"
        required: true

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: MassiveDataScope/loom-actions/.github/workflows/release-on-label.yml@f0d33cbd43cf0ff2b04277528d14021c7871c202 # v1.8.1
    with:
      build-distribution: true
      package-name: loom-kernel
      merge-sha: ${{ inputs.merge_sha || '' }}

  # PyPI's trusted publishing does not support reusable workflows: the token
  # minted inside one names that workflow, not this file, and the publisher on
  # PyPI names this file. So the upload lives here, on the distribution the
  # called workflow left behind.
  publish:
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      # skip-existing so a re-run finishes an upload that landed one file and
      # failed on the next. Without it a partial upload can never be completed:
      # the index rejects the file it already has and takes the run down with it,
      # and a version on PyPI cannot be replaced.
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 2026-07-28 (handles Metadata-Version 2.5)
        with:
          skip-existing: true
