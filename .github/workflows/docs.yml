name: docs

on:
  pull_request:
    branches: ["master"]
    paths:
      - "docs/**"
      - "src/**/*.py"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - "src/**/*.py"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# PRs use a per-PR group so they never block or wait on the Pages deploy lock.
# Push/dispatch use the shared 'pages' group to serialise concurrent deploys.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A release PR carries a version bump and nothing else, and it is the only way
  # CHANGELOG.md, pyproject.toml and uv.lock reach master. Validating it is not
  # possible and not useful: the branch and the PR are pushed with GITHUB_TOKEN,
  # so any run queued against them sits waiting for manual approval and expires
  # unapproved — a red check nobody can turn green. Worse, the release helper
  # merges only when every check that reported has passed, so an expired run that
  # concludes before the helper polls blocks the release outright. Skipping is
  # what the helper already documents as the normal state. The code the bump
  # describes was validated in the pull requests that composed it.
  build:
    if: ${{ !startsWith(github.head_ref, 'docs/release-') }}
    runs-on: ubuntu-latest
    # contents: read is scoped here — build does not need pages or id-token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Wheels only, so no sdist setup script runs while installing uv.
      - name: Install uv
        run: |
          pip install --only-binary :all: "uv==0.10.2"

      # --frozen forces the committed uv.lock resolution and the documentation
      # toolchain is pinned to exact versions.
      # "--no-build" is intentionally omitted: omegaconf (a runtime dependency)
      # requires antlr4-python3-runtime 4.9.3, which ships no wheel on PyPI, so
      # the environment cannot be created from binaries only.
      - name: Build docs (strict)
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen \
            --extra rest \
            --extra sqlalchemy \
            --extra cache \
            --extra config \
            --extra prometheus \
            --with 'sphinx==9.0.4' \
            --with 'furo==2025.12.19' \
            --with 'myst-parser==5.1.0' \
            --with 'sphinx-copybutton==0.5.2' \
            --with 'sphinx-design==0.7.0' \
            sphinx-build -W -b html docs docs/_build/html

      # upload-pages-artifact creates the zip format required by deploy-pages.
      # Used instead of upload-artifact so the deploy job can consume it directly.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only deploy on push to master, not on PRs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # pages: write + id-token: write are required for OIDC-based Pages deployment.
    # Scoped here — deploy does not need contents read.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
