[project]
name = "loom-kernel"
dynamic = ["version"]
description = "Loom Python project"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.18,<1.0",
    "structlog>=24.4,<27.0",
    "omegaconf>=2.3,<3.0",
    "prometheus-client>=0.20",
    "aiocache>=0.12,<1.0",
    "typing_extensions>=4.12",
    "opentelemetry-api>=1.27,<2.0",
]

[project.scripts]
loom = "loom.cli:main"

[project.optional-dependencies]
# The testing helpers under loom.*.testing define pytest fixtures, so importing
# them needs pytest at runtime like any other declared dependency.
testing = [
    "pytest>=8.3.0",
]
rest = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
    "httptools>=0.6,<1.0",
    "uvloop>=0.21,<1.0; sys_platform != 'win32'",
    "prometheus-client>=0.20",
]
sqlalchemy = [
    "sqlalchemy>=2.0,<3.0",
    "greenlet>=3.0",
    "alembic>=1.13,<2",
]
clickhouse = [
    "clickhouse-connect>=0.9.2,<1.0",
]
dynamodb = [
    "boto3>=1.35",
]
mongo = [
    "pymongo>=4.9,<5.0",
]
jwt = [
    "pyjwt[crypto]>=2.8,<3",
]
config = [
    "omegaconf>=2.3,<3.0",
    "fsspec>=2024.2.0",
]
config-ssm = [
    "omegaconf>=2.3,<3.0",
    "fsspec>=2024.2.0",
    "boto3>=1.35",
]
cache = [
    "aiocache>=0.12,<1.0",
    "omegaconf>=2.3,<3.0",
]
etl-polars = [
    "polars>=1.24,<2.0",
    "deltalake>=1.6.2,<2.0",
    "pyarrow>=14.0",
    "fsspec>=2024.2.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
]
# PySpark 3.5 supports Python up to 3.12; the Spark runtime that runs the job
# (EMR, Glue, Databricks) fixes the version, not loom. On 3.13+ the extra
# resolves without Spark.
etl-spark = [
    "pyspark>=3.5,<4.0; python_version < '3.13'",
    "delta-spark>=3.2,<4.0; python_version < '3.13'",
    "findspark>=2.0,<3.0",
    "fsspec>=2024.2.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
]
etl-otel = [
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
]
prefect = [
    "prefect>=3.0,<4.0",
    "fsspec>=2024.2.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3,<3.0",
    "boto3>=1.35",
    "docker>=7.0",
]
pyspark = [
    "pyspark>=3.5,<4.0; python_version < '3.13'",
]
prometheus = [
    "prometheus-client>=0.20",
]
streaming = [
    "anyio>=4.0,<5.0",
    "confluent-kafka>=2.6,<3.0",
    "bytewax>=0.21; python_version < '3.13'",
    "uvloop>=0.21,<1.0; sys_platform != 'win32'",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
]
ai-pydantic = [
    "pydantic-ai-slim>=2.45,<3",
]
ai-bedrock = [
    "pydantic-ai-slim[bedrock]>=2.45,<3",
]
ai-openai = [
    "pydantic-ai-slim[openai]>=2.45,<3",
]
ai-anthropic = [
    "pydantic-ai-slim[anthropic]>=2.45,<3",
]
# TypeSafe's Jev: a decision model that fills a typed output from a state, no
# text. Its model class first shipped in pydantic-ai 2.45.
ai-typesafe = [
    "pydantic-ai-slim[typesafe]>=2.45,<3",
]
# Only an artefact declaring `template:` on an instruction block needs this:
# the engine compiles a Handlebars template and renders it per request. An
# artefact whose instructions are literal never reaches the import.
ai-templates = [
    "pydantic-ai-slim[spec]>=2.45,<3",
]
ai-a2a = [
    "fasta2a>=0.6,<1",
    "a2a-sdk>=1.1,<2",
]
ai-harness = [
    "pydantic-ai-harness[skills]>=0.28,<1",
]
# Logfire is an OTel distribution, not a second telemetry stack: it installs the
# global TracerProvider that loom then SHARES via OtelConfig(endpoint="").
# See docs/ai/observability.md — a non-empty endpoint makes loom build its own
# provider, and the two are mutually exclusive by construction.
logfire = [
    "logfire>=4.0,<5",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
]
celery = [
    "celery>=5.3,<6.0",
    "kombu>=5.3,<6.0",
    "redis>=5.0,<6.0",
]
cli = [
    "pyyaml>=6",
    "typer>=0.12,<1",
]

[project.entry-points."loom.ai.engines"]
pydantic-ai = "loom.ai.engines.pydantic_ai.provider:PydanticAIEngineProvider"

# Authentication strategies for the remote endpoints loom calls out to: MCP
# servers and A2A agents alike, since the contract is httpx.Auth and knows
# nothing of either protocol. A deployment plugs in its own from its own
# package under the same group; loom ships only these three thin delegations.
# See docs/ai/mcp.md and docs/ai/a2a.md.
[project.entry-points."loom.ai.remote_auth"]
oauth = "loom.ai.remote_auth:standard_oauth"
bearer = "loom.ai.remote_auth:bearer_token"
static = "loom.ai.remote_auth:static_headers"

[project.entry-points."loom.etl.backends"]
polars = "loom.etl.backends.polars.provider:PolarsProvider"
spark = "loom.etl.backends.spark.provider:SparkProvider"

# Persistence backends `create_app` resolves from `persistence.backend`. A
# deployment registers its own under the same group from its own package.
[project.entry-points."loom.persistence.backends"]
sqlalchemy = "loom.core.repository.sqlalchemy.backend:SQLAlchemyBackend"
dynamodb = "loom.core.repository.dynamodb.backend:DynamoDBBackend"
mongo = "loom.core.repository.mongo.backend:MongoBackend"
none = "loom.core.persistence.none:NoneBackend"

[build-system]
requires = [
    "hatchling>=1.24.0",
    "hatch-vcs>=0.4.0",
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# A prerelease cannot carry a local version label, and the default scheme
# appends the commit as one, so every dev build would be rejected by the index.
#
# The describe pattern excludes the floating major tag. `v1` moves onto the
# commit each release tags, and reading it as the version yields "2.devN": a
# release that never existed, published from the tag that points at one that did.
[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*.[0-9]*.[0-9]*"

[dependency-groups]
# Isolated on purpose: fastmcp pulls a large transitive tree that only the MCP
# tests need, so the cost is paid by whoever asks for it — `uv sync --group
# mcp-tests` — not by every contributor's default install. Those tests skip
# when fastmcp is absent.
# The 4.x floor is not cosmetic: pydantic-ai builds its HTTP transport with
# `verify=`, which fastmcp only accepts from 4.0 on, so `headers` and `auth`
# — the whole of MCP authentication — raise TypeError against 2.x.
mcp-tests = [
    "fastmcp>=4,<5",
]

dev = [
    "aiocache>=0.12,<1.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30",
    "alembic>=1.13,<2",
    # Declared, not merely transitive: one cache test pins what the key renderer
    # cannot separate inside an object msgspec expands itself, and an attrs class
    # is the only such object the stdlib can build.
    "attrs>=23.1",
    "commitizen>=3.30.0",
    "celery>=5.3,<6.0",
    "fakeredis>=2.23.0",
    "fastapi>=0.115,<1.0",
    "greenlet>=3.0.0",
    "mypy>=1.11.0,<2.0",
    "omegaconf>=2.3,<3.0",
    "pydantic>=2.0,<3.0",
    "pre-commit>=3.8.0",
    "pyright>=1.1.390,<2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pyjwt[crypto]>=2.12.0",
    "redis>=5.0.0",
    "ruff>=0.9.0,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "polars>=1.24,<2.0",
    "clickhouse-connect>=0.9.2,<1.0",
    "pyarrow>=14.0",
    "deltalake>=1.6.2,<2.0",
    "fsspec>=2024.2.0",
    "httptools>=0.6,<1.0",
    "uvloop>=0.21,<1.0; sys_platform != 'win32'",
    "prometheus-client>=0.20",
    "delta-spark>=3.2,<4.0; python_version < '3.13'",
    "chispa>=0.10,<1.0",
    "pytest-cov>=7.1.0",
    "findspark>=2.0.1",
    "confluent-kafka>=2.6,<3.0",
    "bytewax>=0.21; python_version < '3.13'",
    "boto3>=1.35",
    "pymongo>=4.9,<5.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
    "prefect>=3.0,<4.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "types-pyyaml>=6.0.12.20260724",
    "jsonschema>=4.26.0",
    "pydantic-ai-slim[anthropic,bedrock,openai,spec,typesafe]>=2.45,<3",
    "fasta2a>=0.6,<1",
    "a2a-sdk>=1.1,<2",
    "pydantic-ai-harness[skills]>=0.28,<1",
    "typer>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/loom",
]
# The agent-spec JSON Schema is shipped as package data so a generator can
# validate its output against the published contract without importing loom —
# and, by extracting it from the wheel or sdist, without installing loom at all
# (FR-009). 'specs/' is not distributed, so the schema must live under 'src/'.
include = [
    "src/loom/py.typed",
    "src/loom/ai/declarative/schemas/*.json",
    "src/loom/core/repository/sqlalchemy/rls/guard/*.sql",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "Agent",
    "Caller",
    "Exists",
    "Input",
    "Load",
    "LoadById",
    "Mcp",
    "loom.core.use_case.Agent",
    "loom.core.use_case.Caller",
    "loom.core.use_case.Exists",
    "loom.core.use_case.Input",
    "loom.core.use_case.Load",
    "loom.core.use_case.LoadById",
    "loom.core.use_case.Mcp",
    "loom.core.use_case.markers.Agent",
    "loom.core.use_case.markers.Caller",
    "loom.core.use_case.markers.Exists",
    "loom.core.use_case.markers.Input",
    "loom.core.use_case.markers.Load",
    "loom.core.use_case.markers.LoadById",
    "loom.core.use_case.markers.Mcp",
]

[tool.pyright]
pythonVersion = "3.11"
# Resolve imports against the project venv even when pyright is invoked
# directly (editor, hooks) instead of through `uv run`, so a globally
# installed, older dependency never shadows the pinned one.
venvPath = "."
venv = ".venv"
# src only, deliberately. Checking tests as well surfaces 294 errors across
# eight rules — mostly stubs that no longer satisfy the protocol they stand in
# for. That is real signal and worth burning down, but it is a project, not a
# flag flip: turning it on without the cleanup would make the gate meaningless
# on its first run. Tracked in specs/feature/quality/typecheck_tests.md.
include = [
    "src",
]
typeCheckingMode = "standard"
reportMissingModuleSource = "none"
reportMissingImports = "none"
reportPrivateImportUsage = "none"
ignore = [
    "src/loom/etl/testing/spark.py",
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = [
    "src",
]
exclude = [
    "^tests/",
]

[[tool.mypy.overrides]]
module = [
    "pyspark.*",
    "delta.*",
    "findspark",
    "fsspec.*",
    "chispa.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pyarrow.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# 'fasta2a' ships no py.typed marker, but its 'schema' module is the A2A wire
# contract used by 'loom.ai.a2a.server': following it keeps those TypedDicts
# type-checked instead of degrading them to Any.
[[tool.mypy.overrides]]
module = [
    "fasta2a.*",
]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = [
    "docker",
    "docker.*",
    "requests",
    "requests.*",
    "prefect",
    "prefect.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "loom.core.backend.scoped_ddl",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/contract",
]
pythonpath = [
    "src",
]
addopts = "-ra --log-disable=aiosqlite"
asyncio_mode = "auto"
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
markers = [
    "bytewax: tests that exercise the Bytewax adapter and runtime wiring",
    "kafka: tests that exercise Kafka transport and codecs",
    "mongo: tests that need a real MongoDB replica set (tests/integration/persistence/mongo)",
    "integration: end-to-end streaming flow tests",
    "slow: long-running tests that should be opt-in in CI",
    "live: tests that call a real model provider; skipped without credentials",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "scm"
update_changelog_on_bump = true

# A few tests write a module into a pytest temp directory and import it, so
# coverage traces a file that no longer exists when the report is built in
# another job. Those files are fixtures, never product code.
[tool.coverage.run]
omit = [
    "/tmp/*",
    "*/pytest-of-*/*",
]

[tool.semantic_branch]
prerelease = [
    "hotfix/.*",
    "feature/.*",
    "feat/.*",
    "multifeature/.*",
    "breaking/.*",
    "fix/.*",
    "refactor/.*",
    "perf/.*",
]
patch = [
    "hotfix/.*",
    "fix/.*",
    "refactor/.*",
    "perf/.*",
]
minor = [
    "feature/.*",
    "feat/.*",
    "multifeature/.*",
]
major = [
    "breaking/.*",
]
prerelease_ignore = [
    "docs/.*",
    "chore/.*",
    "ci/.*",
    "test/.*",
    "build/.*",
    "dependabot/.*",
]
release_ignore = [
    "wip/.*",
    "docs/.*",
    "chore/.*",
    "ci/.*",
    "test/.*",
    "build/.*",
    "dependabot/.*",
]
