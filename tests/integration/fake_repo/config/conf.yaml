app:
  name: fake_repo
  code_path: ../../..
  rest:
    backend: fastapi
    title: Fake Repo Integration API
    version: 1.0.0
    docs_url: /docs
    redoc_url: /redoc

stores:
  settings:
    cursors:
      signing: ephemeral
  default:
    backend: sqlalchemy
    url: ${oc.env:LOOM_TEST_DATABASE_URL}
    echo: false
    pool:
      pre_ping: true

observability:
  prometheus:
    enabled: false
    config:
      path: /metrics
