# Minimal PoC stack for the Prefect → Fargate/Docker launcher.
# Brings up a local Prefect Server plus a process worker that spawns ETL
# containers via the host's docker socket.
#
# ⚠️  SECURITY WARNING
# The prefect-worker mounts /var/run/docker.sock. Any process inside that
# container can spawn arbitrary containers on the host, mount the host
# filesystem, and escalate to host root. This compose file is for LOCAL
# DEVELOPMENT ONLY. Never deploy it to a shared / production environment.
#
# Usage:
#   docker compose -f docker-compose.local.yaml up -d
#   docker build -t loom-etl-daily-orders:dev -f Dockerfile.daily_orders .
#   python -m my_app.deploy
#   prefect deployment run "daily-orders/daily-orders" -p env=local

networks:
  loom_net:
    driver: bridge

services:
  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    networks: [loom_net]
    environment:
      PREFECT_UI_API_URL: http://localhost:4200/api

  # ClickHouse for the SQL API integration tests (tests/integration/sql).
  # Init SQL creates the canonical users/roles grants matrix (spec §2).
  # HTTP interface exposed on host port 18123 to avoid colliding with other services.
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    ports:
      - "18123:8123"
    networks: [loom_net]
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./tests/integration/sql/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Kafka brokers for tests/integration/streaming/kafka.
  #
  # Two brokers, one suite: `redpanda` is the fast local/PR loop, `kafka` is the
  # fidelity check. The partitioned source uses `assign` without `subscribe` and
  # treats the consumer group purely as an offset store — OffsetFetch/OffsetCommit
  # without group membership. That is exactly where broker implementations may
  # legitimately diverge, so the same suite runs against both.
  #
  # Auto topic creation is OFF on both: tests create topics with an explicit
  # partition count, and `list_parts()` must fail loudly on a missing topic
  # instead of silently auto-creating a 1-partition one.
  #
  #   docker compose -f docker-compose.local.yaml up -d redpanda kafka
  # ---------------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v24.3.5
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --set
      - redpanda.auto_create_topics_enabled=false
    ports:
      - "19092:19092"
    networks: [loom_net]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # NOTE: listener hosts are deliberately empty (`INTERNAL://:9092`), never the
  # literal `0.0.0.0`. The apache/kafka entrypoint derives advertised.listeners
  # from KAFKA_LISTENERS in some paths, and Kafka rejects a non-routable
  # meta-address there — the broker dies at startup with an opaque
  # IllegalArgumentException from StorageTool.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "19093:19093"
    networks: [loom_net]
    environment:
      CLUSTER_ID: loom-kafka-it-cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # MongoDB for tests/integration/persistence/mongo. A single-node replica set:
  # loom's optional transactions (persistence.mongo.transactions) need one, and
  # the contract suite exercises them for real. The healthcheck initiates the
  # set on first contact and passes only once this node is the writable
  # primary, so the CI health loop gates on a set that can open a transaction.
  # The member advertises localhost:27017, which is why the host port is the
  # default one: the driver reconnects to the advertised address.
  #
  #   docker compose -f docker-compose.local.yaml up -d mongo
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    networks: [loom_net]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "
          if (!db.hello().isWritablePrimary) {
            try { rs.status() } catch (e) {
              rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})
            }
            quit(1)
          }"
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 5s

  # Postgres for tests/integration/core/repository/sqlalchemy/postgres: the
  # session-settings hook is exercised against real row-level security. Host
  # port 55432 so a local Postgres on 5432 is left alone.
  #
  #   docker compose -f docker-compose.local.yaml up -d postgres
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:55432:5432"
    networks: [loom_net]
    environment:
      POSTGRES_PASSWORD: loom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  prefect-worker:
    image: prefecthq/prefect:3-latest
    command: >
      sh -c "prefect config set PREFECT_API_URL=http://prefect-server:4200/api &&
             prefect worker start --pool default --type process"
    depends_on: [prefect-server]
    networks: [loom_net]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    working_dir: /workspace
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
