sonar.projectName=loom-py
sonar.organization=massive-data-scope
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Exclude non-source directories from all analysis.
# docs/**/* is required — docs/** alone does not reliably exclude deeply
# nested files (e.g. docs/_build/html/_static/*.js) in all Sonar versions.
# Both patterns are listed so the exclusion is unambiguous.
sonar.exclusions=docs/**,docs/**/*,**/.github/**,**/.github/**/*,tests/**,tests/**/*

# Exclude test and config directories from duplication detection
sonar.cpd.exclusions=tests/**,tests/**/*,**/.github/**,docs/**,docs/**/*

# Exclude test and config directories from coverage obligations
sonar.coverage.exclusions=tests/**,tests/**/*,**/.github/**,docs/**,docs/**/*

# Suppress python:S100 (function naming convention ^[a-z_][a-z0-9_]*$) for
# all public DSL factory functions. These are intentionally PascalCase so
# user code reads like type-constructor / type-annotation syntax:
#
#   Use-case DSL  → Input(), Load(), LoadById(), Exists(), F(...)
#   Model DSL     → ColumnField(), RelationField(), ProjectionField(),
#                   String(), DateTime(), Numeric()
#
# Renaming any of them would be a breaking public API change.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22,e23,e24,e25,e26,e27,e28,e29,e30,e31,e32,e33,e34,e35,e36,e37,e38,e39,e40,e41,e42,e43,e44,e45,e48,e49,e50,e51,e52,e53,e54,e55,e56,e57,e58,e59,e60,e61,e62,e63,e64

