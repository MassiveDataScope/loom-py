# python:S5864 — resolve_engine_provider calls the loaded entry point only
# behind ``isinstance(loaded, type)``, so the call is on a class. Sonar types
# the narrowed value as ``object``, the declared return of load_entry_point,
# and reports it as not callable; pyright and mypy narrow it to a class. Two
# rewrites were tried on the PR analysis and both kept the finding: an
# ``inspect.isclass`` guard, and binding the class to a ``type[object]`` local
# before calling it.
sonar.issue.ignore.multicriteria.e64.ruleKey=python:S5864
sonar.issue.ignore.multicriteria.e64.resourceKey=**/ai/registry.py

