# python:S7503 — async functions that never await, each async by contract.
# The templated-instruction closure is handed to pydantic-ai, whose
# SystemPromptRunner awaits an async callable directly but sends a plain def
# through run_in_executor: async here saves a thread-pool hop per block per
# request. PydanticAIEngine.health and FakeAgentEngine.run/health implement the
# AgentEngine protocol. The unavailable MCP handle and the testing doubles
# implement McpHandle, SqlGrantHandle and AgentHandle, so a use case awaits
# them exactly as it awaits the real handles. AgentRuntime.health is public
# async API, awaited by the FastAPI health endpoint and by applications. The
# two A2A handlers fill the JSON-RPC dispatch table, typed
# ``Callable[[Call], Awaitable[Response]]`` and awaited by the server; the send
# handler next to them does await.
sonar.issue.ignore.multicriteria.e57.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e57.resourceKey=**/ai/engines/pydantic_ai/_instructions.py
sonar.issue.ignore.multicriteria.e58.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e58.resourceKey=**/ai/engines/pydantic_ai/_engine.py
sonar.issue.ignore.multicriteria.e59.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e59.resourceKey=**/ai/runtime/_handle.py
sonar.issue.ignore.multicriteria.e60.ruleKey=python:S7503
